name: ClearLite
version: 1.1
main: me.luna.clearlite.Clearlite
api-version: '1.21'
authors: [TheModpackCurator]
description: Lightweight, safe entity clearing.
softdepend: [Slabbo]
commands:
  clearlite:
    description: Manually clears expendable entities
    usage: /clearlite [simulate|now|reload|status|member]
    aliases: [cl]

permissions:
  clearlite.simulate:
    description: Run a dry run to see how many would be cleared
    default: op
  clearlite.now:
    description: Clear entities immediately
    default: op
  clearlite.reload:
    description: Reload Clearlite config
    default: op
  clearlite.status:
    description: Show Clearlite status (TPS, last run, entities removed)
    default: op
  clearlite.member:
    description: Manage per-member rules (skip items/projectiles, grace overrides)
    default: op